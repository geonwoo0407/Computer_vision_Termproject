<div class="map-zoom" role="group" aria-label="좌석 배치도 확대 및 축소">
  <button type="button" id="zoom-out" aria-controls="seats" aria-label="좌석 배치도 축소">−</button>
  <button type="button" id="zoom-reset" aria-controls="seats" title="기본 배율로 돌아가기" aria-label="기본 배율로 돌아가기">100%</button>
  <button type="button" id="zoom-in" aria-controls="seats" aria-label="좌석 배치도 확대">+</button>
</div>
<div id="seats" class="floor" role="region" aria-label="좌우로 스크롤하는 좌석 배치도" tabindex="0">
  <div class="seat-banks">
    {% for first in range(1, seat_count + 1, 24) %}
    <div class="bank">
      {% for row in range(12) %}
        {% for seat_id in (first + 11 - row, first + 12 + row) if seat_id <= seat_count %}
        <button type="button" class="desk" data-seat-id="{{ seat_id }}" disabled><strong>{{ '%02d'|format(seat_id) }}</strong></button>
        {% endfor %}
      {% endfor %}
    </div>
    {% endfor %}
    <div class="entrance"><span>출입구</span></div>
  </div>
</div>
